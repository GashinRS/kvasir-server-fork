kvasir:
  topics:
    changes-incoming: changes.incoming
    changes-plain-processing-queue: changes.plain-processing-queue
    changes-stateful-processing-queue: changes.stateful-processing-queue
    changes-ref-processing-queue: changes.ref-processing-queue
    changes-processing-completed: changes.processing-completed
    changes-outgoing: changes.outgoing
    storage-events: storage.events
    query-requests: query.requests
    lifecycle-events: lifecycle.events
  messaging:
    kafka:
      auto-create-topics:
        - topic-name: ${kvasir.topics.changes-incoming}
          partitions: 4
          replication-factor: 1
        - topic-name: ${kvasir.topics.changes-processing-completed}
          partitions: 4
          replication-factor: 1
        - topic-name: ${kvasir.topics.changes-outgoing}
          partitions: 4
          replication-factor: 1
        - topic-name: ${kvasir.topics.changes-plain-processing-queue}
          partitions: 4
          replication-factor: 1
        - topic-name: ${kvasir.topics.changes-stateful-processing-queue}
          partitions: 4
          replication-factor: 1
        - topic-name: ${kvasir.topics.changes-ref-processing-queue}
          partitions: 4
          replication-factor: 1
"%test":
  kvasir:
    topics:
      changes-incoming: ${quarkus.uuid}.test.changes.incoming
      changes-plain-processing-queue: ${quarkus.uuid}.test.changes.plain-processing-queue
      changes-stateful-processing-queue: ${quarkus.uuid}.test.changes.stateful-processing-queue
      changes-ref-processing-queue: ${quarkus.uuid}.test.changes.ref-processing-queue
      changes-processing-completed: ${quarkus.uuid}.test.changes.processing-completed
      changes-outgoing: ${quarkus.uuid}.test.changes.outgoing
      storage-events: ${quarkus.uuid}.test.storage.events
      query-requests: ${quarkus.uuid}.test.query.requests
      lifecycle-events: ${quarkus.uuid}.test.lifecycle.events
mp:
  messaging:
    outgoing:
      changes_incoming_publish:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-incoming}
        merge: true
        waitForWriteCompletion: false
      changes_processing_completed_publish:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-processing-completed}
        merge: true
        waitForWriteCompletion: false
      storage_events_publish:
        connector: smallrye-kafka
        topic: ${kvasir.topics.storage-events}
        merge: true
        waitForWriteCompletion: false
      query_requests_publish:
        connector: smallrye-kafka
        topic: ${kvasir.topics.query-requests}
        merge: true
        waitForWriteCompletion: false
      lifecycle_events_publish:
        connector: smallrye-kafka
        topic: ${kvasir.topics.lifecycle-events}
        merge: true
        waitForWriteCompletion: false
    incoming:
      changes_plain_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-plain-processing-queue}
        batch: true
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_stateful_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-stateful-processing-queue}
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_ref_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-ref-processing-queue}
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_outgoing_subscribe:
        connector: smallrye-kafka
        topic: ${kvasir.topics.changes-outgoing}
        broadcast: true
        auto:
          offset:
            reset: earliest
      storage_events_subscribe:
        connector: smallrye-kafka
        topic: ${kvasir.topics.storage-events}
        broadcast: true
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
