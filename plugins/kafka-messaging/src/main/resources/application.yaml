kvasir:
  messaging:
    kafka:
      auto-create-topics:
        - topic-name: changes.incoming
          partitions: 4
          replication-factor: 1
        - topic-name: changes.processing-completed
          partitions: 4
          replication-factor: 1
        - topic-name: changes.outgoing
          partitions: 4
          replication-factor: 1
        - topic-name: changes.plain-processing-queue
          partitions: 4
          replication-factor: 1
        - topic-name: changes.stateful-processing-queue
          partitions: 4
          replication-factor: 1
        - topic-name: changes.ref-processing-queue
          partitions: 4
          replication-factor: 1
mp:
  messaging:
    outgoing:
      changes_incoming_publish:
        connector: smallrye-kafka
        topic: changes.incoming
        merge: true
        waitForWriteCompletion: false
      changes_processing_completed_publish:
        connector: smallrye-kafka
        topic: changes.processing-completed
        merge: true
        waitForWriteCompletion: false
      storage_events_publish:
        connector: smallrye-kafka
        topic: storage.events
        merge: true
        waitForWriteCompletion: false
      query_requests_publish:
        connector: smallrye-kafka
        topic: query.requests
        merge: true
        waitForWriteCompletion: false
      lifecycle_events_publish:
        connector: smallrye-kafka
        topic: lifecycle.events
        merge: true
        waitForWriteCompletion: false
    incoming:
      changes_plain_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: changes.plain-processing-queue
        batch: true
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_stateful_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: changes.stateful-processing-queue
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_ref_processing_queue_subscribe:
        connector: smallrye-kafka
        topic: changes.ref-processing-queue
        broadcast: true
        commit-strategy: throttled
        throttled:
          unprocessed-record-max-age:
            ms: 60000
        auto:
          commit:
            interval:
              ms: 5000
          offset:
            reset: earliest
      changes_outgoing_subscribe:
        connector: smallrye-kafka
        topic: changes.outgoing
        broadcast: true
        auto:
          offset:
            reset: earliest
      storage_events_subscribe:
        connector: smallrye-kafka
        topic: storage.events
        broadcast: true
        auto:
          offset:
            reset: earliest
