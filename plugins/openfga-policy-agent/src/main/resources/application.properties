kvasir.plugins.policy-agent.openfga.enabled=false
openfga.pep.enabled=${kvasir.plugins.policy-agent.openfga.enabled}
openfga.pep.caching=true
openfga.pep.extractors.defaults.subject-extractor=kvasir.plugins.policyagent.openfga.extractors.DefaultSubjectExtractor
openfga.pep.extractors.defaults.relation-extractor=kvasir.plugins.policyagent.openfga.extractors.DefaultRelationExtractor
openfga.pep.extractors.defaults.object-extractor=idlab.quarkus.ext.pep.openfga.runtime.extractors.object.UriPathObjectExtractor
openfga.pep.extractors.defaults.store-extractor=idlab.quarkus.ext.pep.openfga.runtime.extractors.store.FirstPathSegmentStoreExtractor
openfga.pep.extractors.defaults.context-extractor=idlab.quarkus.ext.pep.openfga.runtime.extractors.context.RestHierarchyContextExtractor
openfga.pep.ignored-paths[0]=/favicon.ico
#%test.quarkus.openfga.devservices.http-port=5565
quarkus.cache.caffeine."auth-config".maximum-size=250
quarkus.keycloak.devservices.port=8280
quarkus.keycloak.devservices.create-realm=false
%test.quarkus.keycloak.devservices.create-realm=true