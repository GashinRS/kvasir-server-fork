kvasir.storage.s3.endpoint=http://localhost:28333
kvasir.storage.s3.access-key=kvasir
kvasir.storage.s3.secret-key=kvasirkvasir
kvasir.storage.s3.region=eu-west-1
# Maximum concurrent connections from the storage-api proxy to the S3 backend.
kvasir.storage.s3.proxy-pool-size=200
kvasir.storage.s3.publish-event-types=restore-object,delete-object,put-object,complete-multipart-upload,create-object,get-object,get-object-metadata,write-object-metadata

quarkus.s3.path-style-access=true
quarkus.s3.endpoint-override=${kvasir.storage.s3.endpoint}
quarkus.s3.aws.use-arn-region-enabled=false
quarkus.s3.aws.region=${kvasir.storage.s3.region}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${kvasir.storage.s3.access-key}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${kvasir.storage.s3.secret-key}

# Raise the AWS SDK async HTTP client concurrency so large parallel workloads do not stall
# waiting for a free connection slot (default is 50).
quarkus.s3.async-client.max-concurrency=200
