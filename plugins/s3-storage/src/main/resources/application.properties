kvasir.storage.s3.endpoint=http://localhost:8333
kvasir.storage.s3.access-key=kvasir
kvasir.storage.s3.secret-key=kvasirkvasir
kvasir.storage.s3.region=eu-west-1

quarkus.s3.path-style-access=true
quarkus.s3.endpoint-override=${kvasir.storage.s3.endpoint}
quarkus.s3.aws.use-arn-region-enabled=false
quarkus.s3.aws.region=${kvasir.storage.s3.region}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${kvasir.storage.s3.access-key}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${kvasir.storage.s3.secret-key}
