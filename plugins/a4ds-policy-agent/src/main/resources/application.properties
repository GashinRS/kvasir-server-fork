kvasir.plugins.policy-agent.a4ds.enabled=false
kvasir.plugins.policy-agent.a4ds.default-uma-server-url=http://localhost:4000/uma
quarkus.arc.exclude-types=io.quarkus.smallrye.jwt.runtime.auth.JWTAuthMechanism

quarkus.http.auth.permission."uma-protected".enabled=${kvasir.plugins.policy-agent.a4ds.enabled}
quarkus.http.auth.permission."uma-protected".methods=HEAD,GET,POST,PUT,DELETE
quarkus.http.auth.permission."uma-protected".paths=/*
quarkus.http.auth.permission."uma-protected".auth-mechanism=bearer
quarkus.http.auth.permission."uma-protected".policy=authenticated

quarkus.http.auth.permission."allow-dev-console".enabled=${kvasir.plugins.policy-agent.a4ds.enabled}
quarkus.http.auth.permission."allow-dev-console".methods=HEAD,GET,POST
quarkus.http.auth.permission."allow-dev-console".paths=/q/*
quarkus.http.auth.permission."allow-dev-console".policy=permit

quarkus.http.auth.permission."allow-pod-actions".enabled=${kvasir.plugins.policy-agent.a4ds.enabled}
quarkus.http.auth.permission."allow-pod-actions".methods=HEAD,GET,POST
quarkus.http.auth.permission."allow-pod-actions".paths=/
quarkus.http.auth.permission."allow-pod-actions".policy=permit

quarkus.http.auth.permission."allow-well-known".enabled=${kvasir.plugins.policy-agent.a4ds.enabled}
quarkus.http.auth.permission."allow-well-known".methods=HEAD,GET
quarkus.http.auth.permission."allow-well-known".paths=/.well-known/*
quarkus.http.auth.permission."allow-well-known".policy=permit

quarkus.http.auth.permission."allow-favicon".enabled=${kvasir.plugins.policy-agent.a4ds.enabled}
quarkus.http.auth.permission."allow-favicon".methods=HEAD,GET
quarkus.http.auth.permission."allow-favicon".paths=/favicon.ico
quarkus.http.auth.permission."allow-favicon".policy=permit