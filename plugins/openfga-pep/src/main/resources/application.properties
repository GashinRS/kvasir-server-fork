openfga.pep.enabled=true
openfga.pep.caching=true
openfga.pep.api-url=${kvasir.pep.openfga.url}
openfga.devservices.enabled=false
openfga.pep.post-check-hook=kvasir.plugins.policyagent.openfga.delegated.PostCheckDelegator
openfga.pep.extractors.defaults.subject-extractor=kvasir.plugins.policyagent.openfga.extractors.DefaultSubjectExtractor
openfga.pep.extractors.defaults.relation-extractor=kvasir.plugins.policyagent.openfga.extractors.DefaultRelationExtractor
openfga.pep.extractors.defaults.object-extractor=idlab.quarkus.ext.pep.openfga.model.extractors.object.UriPathObjectExtractor
openfga.pep.extractors.defaults.store-extractor=idlab.quarkus.ext.pep.openfga.model.extractors.store.FirstPathSegmentStoreExtractor
openfga.pep.extractors.defaults.context-extractor=kvasir.plugins.policyagent.openfga.extractors.DefaultContextExtractor
openfga.pep.extractors.defaults.contextual-tuples-extractor=idlab.quarkus.ext.pep.openfga.model.extractors.context.RestHierarchyContextualTuplesExtractor
openfga.pep.ignored-paths[0]=/favicon.ico
quarkus.cache.caffeine."auth-config".maximum-size=250

kvasir.auth.keycloak.url=http://localhost:8280
kvasir.auth.keycloak.realm=quarkus
quarkus.keycloak.admin-client.server-url=${kvasir.auth.keycloak.url}

kvasir.pep.openfga.url=http://localhost:8380

kvasir.pod.auth.oidc.server-url=${kvasir.auth.keycloak.url}/realms/quarkus
kvasir.pod.auth.oidc.principal-extractor.class-name=kvasir.plugins.policyagent.openfga.extractors.SimpleJWTPrincipalExtractor
kvasir.pod.auth.oidc.principal-extractor.config.attribute-name=preferred_username
kvasir.pod.auth.oidc.jwt-allowed-clock-skew-seconds=30
kvasir.pod.auth.uma.server-url=http://localhost:4000/uma
kvasir.pod.auth.uma.jwt-allowed-clock-skew-seconds=30
kvasir.pod.auth.uma.principal-extractor.class-name=kvasir.plugins.policyagent.openfga.extractors.SimpleJWTPrincipalExtractor
kvasir.pod.auth.uma.principal-extractor.config.attribute-name=sub

quarkus.cache.caffeine."dpop-jti-cache".expire-after-write=5m