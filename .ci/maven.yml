# .ci/maven.yml
# Maven build jobs: unit/integration tests and container image packaging.

# Code changes that warrant a Maven build. Merged into rule entries with <<:.
# Pure Writerside/docs changes skip these jobs entirely.
.code-changes:
  - &code-changes
    changes:
      - "pom.xml"
      - "**/pom.xml"
      - "libs/**/*"
      - "plugins/**/*"
      - "services/**/*"

test:maven:
  extends:
    - .test-cache
    - .docker-in-docker
  stage: test
  image: $CI_TOOLS_IMAGE-docker
  tags: ["cache", "docker"]
  variables:
    COMPOSE_HOSTNAME: docker
    KVASIR_KG_CLICKHOUSE_HOST: docker
    KVASIR_KG_CLICKHOUSE_PORT: 28123
    KVASIR_KG_CLICKHOUSE_USER: kvasir
    KVASIR_KG_CLICKHOUSE_PASSWORD: kvasirkvasir
    KVASIR_MESSAGING_KAFKA_BOOTSTRAP_SERVERS: docker:29092
    KVASIR_STORAGE_S3_ENDPOINT: http://docker:28333
    KVASIR_AUTH_KEYCLOAK_URL: http://docker:28280
    KVASIR_PEP_OPENFGA_URL: http://docker:28380
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *code-changes
  script:
    - set -xe
    - mise install && eval "$(mise env -s bash)"
    - docker compose -f compose/compose.devservices.yml --env-file compose/.env.devservices up --wait --quiet-pull --no-color
    - ./mvnw $MAVEN_CLI_OPTS test -Pservices -Dcompose.skip=true -Dmodel-tx.skip=true
  interruptible: true
  after_script:
    - ./.ci/scripts/collect-compose-diagnostics.sh compose-diagnostics --file compose/compose.devservices.yml
    - docker compose -f compose/compose.devservices.yml down --volumes --remove-orphans || true
    - awk -F, '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, "instructions covered"; print 100*covered/instructions, "% covered" }' target/coverage/jacoco.csv || exit 0
  coverage: '/(\d+\.\d+) % covered/'
  artifacts:
    paths:
      - compose-diagnostics/
      - "**/target"
    reports:
      coverage_report:
        coverage_format: jacoco
        path: target/coverage/jacoco.xml
      junit: "**/TEST-*.xml"
    expire_in: 1 day
    when: always

package:maven:
  extends:
    - .package-cache
    - .docker-in-docker
  stage: package
  needs:
    - job: test:maven
      optional: true
  # On MR pipelines test:maven already compiled all sources; skip recompilation
  # so package:maven only runs Quarkus augmentation + Jib image push.
  # On tag pipelines test:maven never runs, so we do a full compile from the warm cache.
  variables:
    MAVEN_SKIP_MAIN_COMPILE: ""
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *code-changes
      variables:
        MAVEN_SKIP_MAIN_COMPILE: "-Dmaven.main.skip=true"
  image: $CI_TOOLS_IMAGE
  tags: ["cache"]
  script:
    - mise install && eval "$(mise env -s bash)"
    # Strip the "v" prefix from IMAGE_TAG so container images use bare semver (0.21.0)
    # matching the versions in pom.xml, compose.kvasir.yml, and values.yaml.
    # Git tags carry the prefix (v0.21.0) but manifests and image tags do not.
    - CONTAINER_TAG="${IMAGE_TAG#v}"
    - >-
      ./mvnw $MAVEN_CLI_OPTS -DskipTests $MAVEN_SKIP_MAIN_COMPILE package
      -Pservices -Dcompose.skip=true -Dmodel-tx.skip=true -T 1C
      -Dquarkus.container-image.push=$QUARKUS_CONTAINER_IMAGE_PUSH
      -Dquarkus.container-image.tag=${CONTAINER_TAG}
      -Dquarkus.container-image.additional-tags=${IMAGE_ADDITIONAL_TAG}
  interruptible: true
  artifacts:
    paths:
      - "services/monolith/target/openapi"
