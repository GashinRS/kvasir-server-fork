# ── Anchor definitions ────────────────────────────────────────────────────────
# All private anchors live under .anchors so GitLab ignores this as a hidden job.
# They are referenced below to build rule lists and cache entries without repeating
# identical lines across multiple hidden job templates.

.anchors:
  # Rule entry anchors
  - &never-on-tag
    if: $CI_COMMIT_TAG
    when: never
  - &rule-mr
    if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - &rule-default-branch
    if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  - &rule-maintenance-branches
    if: '$CI_COMMIT_BRANCH =~ /^(v\d+\..+|maint\/.+)$/'

# ── Rule templates (extended by jobs in other files) ──────────────────────────

# MR pipelines only (tests, smoke tests).
.mr-only:
  rules:
    - *never-on-tag
    - *rule-mr

# MR pipelines and the default branch (e.g. docs build).
.branch-only:
  rules:
    - *never-on-tag
    - *rule-mr
    - *rule-default-branch

# Default branch only (e.g. pages deploy).
.main-branch-only:
  rules:
    - *never-on-tag
    - *rule-default-branch

# Default branch and maintenance/version branches (release jobs).
# NOTE: the default branch uses a plain == check — variable expansion does not
# work inside regex literals in GitLab CI if: expressions.
.release-branches-only:
  rules:
    - *never-on-tag
    - *rule-default-branch
    - *rule-maintenance-branches

# ── Cache templates ───────────────────────────────────────────────────────────
# GitLab CI `extends` overwrites arrays (including `cache:`), it does NOT merge
# them. Therefore we pre-compose every required combination here using anchors.
#
# Anchors are file-local, which is fine — all cache templates live in this file
# and consumer jobs in other files reference them via `extends`.
#
# Cache ownership:
#   test:maven   → .test-cache    (pull-push: primes maven, pnpm, and mise)
#   package:maven → .package-cache (pull: reads all three)
#   all others   → .mise-cache-ro (pull: reads mise only)

.anchors-cache:
  - &maven-cache-rw
    key: ${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - ${CI_DEFAULT_BRANCH}
    paths:
      - .m2/repository/
    policy: pull-push
  - &maven-cache-ro
    key: ${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - ${CI_DEFAULT_BRANCH}
    paths:
      - .m2/repository/
    policy: pull
  - &pnpm-cache
    key:
      files:
        - services/ui-service/src/main/frontend/pnpm-lock.yaml
    paths:
      - services/ui-service/src/main/frontend/.pnpm-store
  - &mise-cache-rw
    key:
      prefix: mise-
      files: ["mise.toml"]
    paths:
      - .mise/installs
    policy: pull-push
  - &mise-cache-ro
    key:
      prefix: mise-
      files: ["mise.toml"]
    paths:
      - .mise/installs
    policy: pull

# test:maven — primes all three caches.
.test-cache:
  variables:
    MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  cache:
    - *maven-cache-rw
    - *pnpm-cache
    - *mise-cache-rw

# package:maven — reads all three caches (never writes back).
.package-cache:
  variables:
    MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  cache:
    - *maven-cache-ro
    - *pnpm-cache
    - *mise-cache-ro

# Jobs that only need mise tools (compose, kind, timoni).
.mise-cache-ro:
  variables:
    MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  cache:
    - *mise-cache-ro

# ── Infrastructure ────────────────────────────────────────────────────────────

.docker-in-docker:
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  tags: ["docker"]
