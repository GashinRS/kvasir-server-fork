# .ci/compose.yml
# Compose smoke test: spins up the full kvasir stack and runs end-to-end checks.

# Code changes that warrant a Maven build. Merged into rule entries with <<:.
.code-changes:
  - &code-changes
    changes:
      - "pom.xml"
      - "**/pom.xml"
      - "libs/**/*"
      - "plugins/**/*"
      - "services/**/*"

verify:compose:
  extends:
    - .docker-in-docker
  tags: ["docker"]
  image: $CI_TOOLS_IMAGE
  stage: verify
  variables:
    COMPOSE_HOSTNAME: "docker"
    HURL_VERSION: "7.1.0"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *code-changes
  needs:
    - job: package:maven
      optional: true
  before_script:
    - set -xe
    - ./.ci/scripts/wait-for-docker.sh
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - set -xe
    - sed -i "s%kvasir/kvasir-server/monolith:.*%$QUARKUS_CONTAINER_IMAGE_GROUP/monolith:$IMAGE_TAG%g" compose/compose.kvasir.yml
    - docker compose -f compose/compose.yml up -d --wait --quiet-pull --no-color
    - hurl --variables-file api-tests/hurl.env.ci --variable ts=$(date +%s) --test --report-junit api-tests/junit.xml api-tests/
  after_script:
    - cd compose || exit 0
    - ../.ci/scripts/collect-compose-diagnostics.sh diagnostics
    - docker compose down --volumes --remove-orphans || true
  artifacts:
    paths:
      - compose/diagnostics/
      - compose/compose.kvasir.yml
    reports:
      junit: api-tests/junit.xml
    when: always
    expire_in: 1 week
