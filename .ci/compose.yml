# .ci/compose.yml
# Compose smoke test: spins up the full kvasir stack and runs end-to-end checks.

# Code changes that warrant a Maven build. Merged into rule entries with <<:.
.code-changes:
  - &code-changes
    changes:
      - "pom.xml"
      - "**/pom.xml"
      - "libs/**/*"
      - "plugins/**/*"
      - "services/**/*"
      - ".ci/compose.yml"
      - ".ci/templates.yml"
      - "Justfile"
      - "mise.toml"
      - "api-tests/**/*"
      - "compose/**/*"

verify:compose:
  extends:
    - .mise-cache-ro
    - .docker-in-docker
  tags: ["docker"]
  image: $CI_TOOLS_IMAGE-docker
  stage: verify
  variables:
    COMPOSE_HOSTNAME: "docker"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *code-changes
  needs:
    - job: package:maven
      optional: true
  before_script:
    - set -xe
    - ./.ci/scripts/wait-for-docker.sh
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - set -xe
    - mise install && eval "$(mise env -s bash)"
    - KVASIR_IMAGE="$CI_REGISTRY/$CI_PROJECT_PATH/monolith"
    - KVASIR_TAG=$(./.ci/scripts/resolve-image-tag.sh "$KVASIR_IMAGE")
    - echo "Using image $KVASIR_IMAGE:$KVASIR_TAG"
    - sed -i "s%kvasir/kvasir-server/monolith:.*%${KVASIR_IMAGE#*/}:$KVASIR_TAG%g" compose/compose.kvasir.yml
    - docker compose -f compose/compose.yml up -d --wait --quiet-pull --no-color
    - hurl --variables-file api-tests/hurl.env.ci --variable ts=$(date +%s) --test --report-junit api-tests/junit-compose.xml api-tests/
  after_script:
    - cd compose || exit 0
    - ../.ci/scripts/collect-compose-diagnostics.sh diagnostics
  artifacts:
    paths:
      - compose/diagnostics/
      - compose/compose.kvasir.yml
    reports:
      junit: api-tests/junit-compose.xml
    when: always
    expire_in: 1 week
