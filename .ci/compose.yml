# .ci/compose.yml
# Compose smoke test: spins up the full kvasir stack and runs end-to-end checks.

# Code changes that warrant a Maven build. Merged into rule entries with <<:.
.code-changes:
  - &code-changes
    changes:
      - "pom.xml"
      - "**/pom.xml"
      - "libs/**/*"
      - "plugins/**/*"
      - "services/**/*"

verify:compose:
  extends:
    - .docker-in-docker
  tags: ["docker"]
  image: docker
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *code-changes
  needs:
    - job: package:maven
      optional: true
  before_script:
    - set -xe
    - apk add --no-cache bash jq curl
    - ./.ci/scripts/wait-for-docker.sh
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - set -xe
    - cd compose
    - 'sed -i "s%kvasir/kvasir-server/monolith:.*%$QUARKUS_CONTAINER_IMAGE_GROUP/monolith:$IMAGE_TAG%g" compose.kvasir.yml'
    - docker compose up -d --wait --quiet-pull --no-color
    - tests/compose-smoke-test.sh docker
  after_script:
    - cd compose || exit 0
    - ../.ci/scripts/collect-compose-diagnostics.sh diagnostics
    - docker compose down --volumes --remove-orphans || true
  artifacts:
    paths:
      - compose/diagnostics/
      - compose/compose.kvasir.yml
    expire_in: 1 week
    when: on_failure
