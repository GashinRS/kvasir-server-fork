smoke_test:compose:
  extends:
    - .ignore-tags
    - .docker-in-docker
    - .branch-only
  tags: ["docker"]
  image: docker
  stage: verify
  before_script:
    - set -xe
    - apk add --no-cache bash jq curl
    - ./.ci/scripts/wait-for-docker.sh
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - set -xe
    - cd compose
    - sed -i "s%kvasir/kvasir-server/monolith:.*%$QUARKUS_CONTAINER_IMAGE_GROUP/monolith:$IMAGE_TAG%g" compose.kvasir.yml
    - docker compose up -d --wait --quiet-pull --no-color
    - tests/compose-smoke-test.sh docker
  after_script:
    - |
      # Collect comprehensive diagnostics
      cd compose || exit 0
      ../.ci/scripts/collect-compose-diagnostics.sh \
        "" \
        diagnostics \
        monolith kafka clickhouse seaweedfs keycloak postgresql openfga

      # Tear down compose stack
      docker compose down --volumes --remove-orphans || true
  artifacts:
    paths:
      - compose/diagnostics/
      - compose/compose.kvasir.yml
    expire_in: 1 week
    when: on_failure
