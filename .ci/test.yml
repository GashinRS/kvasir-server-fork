smoke_test:compose:
  extends:
    - .ignore-tags
    - .docker-in-docker
    - .branch-only
  tags: ["docker"]
  image: docker
  stage: verify
  before_script:
    - set -xe
    - apk add --no-cache bash jq curl
    - ./.ci/scripts/wait-for-docker.sh
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$DOCKER_TOKEN" | docker login docker.redpanda.com -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - set -xe
    - cd docker-compose
    - sed -i "s%kvasir/kvasir-server/monolith:.*%$QUARKUS_CONTAINER_IMAGE_GROUP/monolith:$IMAGE_TAG%g" docker-compose.yml
    - docker compose up -d --wait --quiet-pull --no-color
    - docker ps
    - tests/compose-smoke-test.sh docker
  after_script:
    - cd docker-compose
    - docker ps -a > compose-ps.txt
    - docker compose logs --no-color > compose-logs.txt
    - docker compose down
  artifacts:
    paths:
      - docker-compose/compose-logs.txt
      - docker-compose/docker-compose.yml
      - docker-compose/compose-ps.txt
    expire_in: 1 week
    when: on_failure
