propose-release:
  stage: pre
  image:
    name: $CI_TOOLS_IMAGE
    pull_policy: always
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "next"'
  script:
    - set -xe
    - ./.ci/scripts/propose-release.sh

release:tag_and_release:
  extends: .release-commit-only
  stage: release
  image:
    name: $CI_TOOLS_IMAGE
    pull_policy: always
  script:
    - set -xe
    - ./.ci/scripts/extract-release-info.sh
    - ./.ci/scripts/create-gitlab-release.sh
  artifacts:
    reports:
      dotenv: release.env
    paths:
      - release_notes.md

release:retag-images:
  extends: .release-commit-only
  stage: release
  needs:
    - job: release:tag_and_release
      artifacts: true
  image:
    name: $CI_TOOLS_IMAGE
    pull_policy: always
  tags: ["docker"]
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - ./.ci/scripts/retag-images.sh

release:update-changelog:
  extends: .release-commit-only
  stage: release
  image:
    name: $CI_TOOLS_IMAGE
    pull_policy: always
  needs:
    - job: release:tag_and_release
      artifacts: true
  script:
    - ./.ci/scripts/update-changelog.sh

sync:main_to_next:
  extends: .release-commit-only
  stage: sync # Runs after the release is done
  image:
    name: $CI_TOOLS_IMAGE
    pull_policy: always
  variables:
    GIT_DEPTH: 0
  script:
    - ./.ci/scripts/sync-main-to-next.sh
