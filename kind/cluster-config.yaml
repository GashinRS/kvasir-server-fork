kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kvasir
# Base kind config. Used as-is for local development (kind defaults bind the
# apiserver on 127.0.0.1 and add it to the cert SANs, so `just kind-up` works
# out-of-the-box). CI merges `kind/cluster-config-ci.overlay.yaml` on top of
# this file via yq to add docker-in-docker networking and the 'docker' SAN.
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
