apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:26.3.9-alpine
          env:
            - name: CLICKHOUSE_LOG_TO_CONSOLE
              value: "1"
            - name: CLICKHOUSE_USER
              value: kvasir
            - name: CLICKHOUSE_PASSWORD
              value: kvasirkvasir
          ports:
            - containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
