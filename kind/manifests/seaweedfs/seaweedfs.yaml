apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  namespace: seaweedfs
data:
  config.json: |
    {
      "identities": [
        {
          "name": "kvasir",
          "credentials": [
            {
              "accessKey": "kvasir",
              "secretKey": "kvasirkvasir"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/config.json
            - -s3.externalUrl=http://seaweedfs-s3.seaweedfs:8333
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 9333
              name: master
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: 9333
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs/config.json
              subPath: config.json
      volumes:
        - name: config
          configMap:
            name: seaweedfs-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
