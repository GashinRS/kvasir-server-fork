apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga
  template:
    metadata:
      labels:
        app: openfga
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/busybox:1.37
          command: ['sh', '-c', 'until nc -z postgresql 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done']
        - name: migrate
          image: docker.io/openfga/openfga:v1.14.2
          args: ["migrate"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: postgres://postgres:password@postgresql:5432/postgres?sslmode=disable
      containers:
        - name: openfga
          image: docker.io/openfga/openfga:v1.14.2
          args: ["run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: postgres://postgres:password@postgresql:5432/postgres?sslmode=disable
            - name: OPENFGA_DATASTORE_MAX_OPEN_CONNS
              value: "100"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: openfga
spec:
  selector:
    app: openfga
  ports:
    - name: http
      port: 8380
      targetPort: 8080
    - name: grpc
      port: 8381
      targetPort: 8081
