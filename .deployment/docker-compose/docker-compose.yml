services:
  kvasir:
    # The Kvasir monolith bundles all Kvasir microservices into a single image (handy for development and testing)
    image: gitlab.ilabt.imec.be:4567/kvasir/kvasir-server/monolith:latest
    pull_policy: always
    ports:
      - "8080:8080"
    volumes:
      # Load Kvasir bootstrap config (auto-creating a demo pod 'alice')
      - './kvasir-config:/home/jboss/config'
    environment:
      - KVASIR_KG_CLICKHOUSE_HOST=clickhouse
      - KVASIR_KG_CLICKHOUSE_PORT=8123
      - KVASIR_SERVICES_STORAGE_S3_HOST=minio
      - KVASIR_SERVICES_STORAGE_S3_PORT=9000
      - QUARKUS_MINIO_URL=http://minio:9000/
      - QUARKUS_MINIO_SECURE=false
      - QUARKUS_MINIO_ACCESS_KEY=kvasir
      - QUARKUS_MINIO_SECRET_KEY=kvasirkvasir
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  clickhouse:
#    24.8 = LTS version
    image: clickhouse/clickhouse-server:24.8.11.5
    ports:
      - "8123:8123"
      # TCP port for ClickHouse (should not be required externally)
      #- "9000:9000"
    volumes:
      - 'clickhouse_data:/var/lib/clickhouse'
      - './ch-config:/etc/clickhouse-server/users.d'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    environment:
      # Doubles as access key and secret key for the MinIO server
      - MINIO_ROOT_USER=kvasir
      - MINIO_ROOT_PASSWORD=kvasirkvasir
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka:9092
      - --mode dev-container
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.2
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 30s
      timeout: 10s
      retries: 5

  kvasir-ui:
    image: gitlab.ilabt.imec.be:4567/kvasir/kvasir-server/kvasir-ui:latest
    pull_policy: always
    depends_on:
      - kvasir
    ports:
      - "8081:80"
    environment:
      - "KVASIR_HOST=http://localhost:8080"

volumes:
  clickhouse_data:
    driver: local
  minio_data:
    driver: local