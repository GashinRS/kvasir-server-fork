services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.9-alpine
    environment:
      - CLICKHOUSE_LOG_TO_CONSOLE=1
      - CLICKHOUSE_USER=kvasir
      - CLICKHOUSE_PASSWORD=kvasirkvasir
    ports:
      - "${KVASIR_PORT_CLICKHOUSE:-8123}:8123"
      # tcp port for clickhouse (should not be required externally)
      #- "9000:9000"
    volumes:
      - "clickhouse_data:/var/lib/clickhouse"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.21
    ports:
      - "${KVASIR_PORT_S3:-8333}:8333" # S3 API port
    volumes:
      - "seaweedfs_data:/data"
      - "./seaweedfs-config.json:/etc/seaweedfs/config.json${SELINUX_SUFFIX:-}"
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/config.json -s3.externalUrl=http://${COMPOSE_HOSTNAME:-localhost}:${KVASIR_PORT_S3:-8333} -dir=/data -volume.max=0 -volume.readBufferSizeMB=8
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  kafka:
    image: docker.io/apache/kafka:4.2.0
    hostname: kafka
    environment:
      # Cluster ID for KRaft mode
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${COMPOSE_HOSTNAME:-localhost}:${KVASIR_PORT_KAFKA:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Dev-friendly settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_FLUSH_INTERVAL_MS: 5000
    ports:
      - "${KVASIR_PORT_KAFKA:-9092}:9092"
    volumes:
      - "kafka_data:/var/lib/kafka/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    depends_on:
      - postgresql
    ports:
      - "${KVASIR_PORT_KEYCLOAK:-8280}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_DATABASE_NAME: postgres
      KEYCLOAK_DATABASE_USER: postgres
      KEYCLOAK_DATABASE_PASSWORD: password
      KC_DB_POOL_MAX_SIZE: 10
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      # default Keycloak image doesn't have curl or alternatives, so we have to do some shell wizardry
      # see https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep '200 OK' >/dev/null; exit $?",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
    command: ["start-dev"]

  postgresql:
    image: docker.io/library/postgres:17
    command: postgres -c 'max_connections=100'
    networks:
      - default
    ports:
      - "${KVASIR_PORT_POSTGRES:-5432}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - "postgresql_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 2s
      retries: 15

  migrate:
    depends_on:
      postgresql:
        condition: service_healthy
    image: docker.io/openfga/openfga:v1.14.2
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgresql:5432/postgres?sslmode=disable
    command: migrate

  openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: docker.io/openfga/openfga:v1.14.2
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgresql:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=80 #see postgres container, should be less than [pg max_connections] - [Keycloak max connections]
      - OPENFGA_PLAYGROUND_ENABLED=true
    ports:
      - "${KVASIR_PORT_OPENFGA_HTTP:-8380}:8080" #http
      - "${KVASIR_PORT_OPENFGA_GRPC:-8381}:8081" #grpc
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 15s
      timeout: 2s
      retries: 15

volumes:
  clickhouse_data:
    driver: local
  seaweedfs_data:
    driver: local
  postgresql_data:
    driver: local
  kafka_data:
    driver: local
