kind: "postgresql"
apiVersion: "acid.zalan.do/v1"

metadata:
  name: "pgkeycloak"
  namespace: "keycloak"

spec:
  teamId: "keycloak"
  postgresql:
    version: "16"
  numberOfInstances: 1
  volume:
    size: "10Gi"
  users:
    keycloak: ["SUPERUSER"]
  databases:
    keycloak: keycloak

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 500Mi