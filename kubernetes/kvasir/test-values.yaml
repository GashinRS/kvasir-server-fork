global:
  host: kvasir.10.10.135.157.nip.io
  ingressRoutes:
    matchHost: true
  image:
    registry: localhost:5001/kvasir
    pullPolicy: Always
    tag: 1.0.0-SNAPSHOT

  deploymentStrategy:
    type: Recreate

  quarkus:
    httpPort: 8080
    metricsPort: 9000

  oidc:
    enabled: true
    authServerUrl: "http://keycloak.10.10.135.157.nip.io/realms/quarkus"
    clientId: "quarkus-app"
    clientSecret: "secret"
    realm: "quarkus"
    existingSecret: ""
    clientIdSecretKey: ""
    clientSecretSecretKey: ""
    realmSecretKey: ""

  minio:
    host: "minio.minio.svc.cluster.local"
    port: "9000"
    skipTlsVerify: true
    useTls: false
    accessKey: "admin"
    secretKey: "miniopassword"
    existingSecret: ""
    accessKeySecretKey: ""
    secretKeySecretKey: ""

  kafka:
    bootstrapServers: "kvasir-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"

  clickhouse:
    host: "clickhouse-clickhouse.clickhouse.svc.cluster.local"
    port: "8123"
