variables:
  INSTANCE: "Writerside/kd"
  ARTIFACT: "webHelpKD2-all.zip"
  DOCKER_VERSION: "2025.04.8412"
  ALGOLIA_ARTIFACT: "algolia-indexes-KD.zip"
  ALGOLIA_APP_NAME: "23BLLNEZ2S"
  ALGOLIA_INDEX_NAME: "prod_KVASIR-NEXT"
  CONFIG_JSON_PRODUCT: "kd"
  CONFIG_JSON_VERSION: "main"
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true
    -Dstyle.color=always
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=target/
    -XX:ErrorFile=target/hs_err_pid%p.log
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  QUARKUS_JIB_BASE_JVM_IMAGE: "gitlab.ilabt.imec.be:4567/obelisk/packages/eclipse-temurin:21.0.6_7-jre-noble"
  JDK_IMAGE: "gitlab.ilabt.imec.be:4567/obelisk/packages/eclipse-temurin:21.0.6_7-jdk-noble"
  NODE_IMAGE: "gitlab.ilabt.imec.be:4567/obelisk/packages/node:20"
  QUARKUS_JIB_PLATFORMS: "linux/amd64,linux/arm64/v8"
  QUARKUS_CONTAINER_IMAGE_PUSH: "false"
  QUARKUS_CONTAINER_IMAGE_REGISTRY: $CI_REGISTRY
  QUARKUS_CONTAINER_IMAGE_GROUP: $CI_PROJECT_PATH
  QUARKUS_CONTAINER_IMAGE_USERNAME: $CI_REGISTRY_USER
  QUARKUS_CONTAINER_IMAGE_PASSWORD: $CI_REGISTRY_PASSWORD

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"
        IMAGE_ADDITIONAL_TAGS: "latest"
        QUARKUS_CONTAINER_IMAGE_PUSH: "true"

    #    Ignore Draft MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: &commitBranchVersions
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
        IMAGE_ADDITIONAL_TAGS: "$CI_COMMIT_REF_SLUG"
        QUARKUS_CONTAINER_IMAGE_PUSH: "true"
    #   Don't trigger branch pipeline when there is an open MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
      variables: *commitBranchVersions

.mavenChanges: &mavenChanges
  - "!(ui)/**/src/**/*"
  - "!(ui)/**/pom.xml"

.uiChanges: &uiChanges
  - "ui/**/*"
  - "**/package.json"
  - ".gitlab-ci.yml"

stages:
  - test
  - package
  - verify
  - deploy
  - search

build:kvasir-ui:
  stage: test
  image: $NODE_IMAGE
  tags:
    - cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - ui/node_modules/
    policy: pull-push
    when: always
  script:
    - cd ./ui
    - npm ci
    - npm run build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - ui/dist/
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
    - changes: *uiChanges

package:kvasir-ui:
  stage: package
  needs:
    - build:kvasir-ui
  tags:
    - docker
    - cache
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:latest
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create tls-context
    - docker --context tls-context buildx create --name multiarch --driver docker-container --bootstrap
    - docker buildx use multiarch
    - docker buildx ls
  script:
    - cd ./ui
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker buildx build -t ${CI_REGISTRY_IMAGE}/kvasir-ui:${IMAGE_TAG} -t ${CI_REGISTRY_IMAGE}/kvasir-ui:${IMAGE_ADDITIONAL_TAGS} -f docker/Dockerfile --platform linux/amd64,linux/arm64 -o type=registry --provenance false .
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:maven:
  stage: test
  image: $JDK_IMAGE
  tags: ["cache", "docker"]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull-push
    when: always
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
    - changes: *mavenChanges
      variables:
        SKIP_TESTS: "-DskipTests"
  script:
    - ./mvnw $MAVEN_CLI_OPTS $SKIP_TESTS package -Pservices
  interruptible: true
  after_script:
    - awk -F,
      '{ instructions += $4 + $5; covered += $5 } END
      { print covered, "/", instructions, "instructions covered";
      print 100*covered/instructions, "% covered (line coverage)" }'
      target/coverage/jacoco.csv
  coverage: '/(\d+\.\d+) % covered/'
  artifacts:
    paths:
      - "**/target"
    reports:
      coverage_report:
        coverage_format: jacoco
        path: target/coverage/jacoco.xml
      junit: "**/TEST-*.xml"
    when: always

package:maven:
  stage: package
  needs: [build:maven]
  image: $JDK_IMAGE
  tags: ["cache"]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull-push
  parallel:
    matrix:
      - KEYCLOAK_POLICY_ENFORCER: "true"
        UMA_POLICY_ENFORCER: "false"
        QUARKUS_CONTAINER_IMAGE_TAG: ${IMAGE_TAG}-keycloak
        QUARKUS_CONTAINER_IMAGE_ADDITIONAL_TAGS: ${IMAGE_TAG},${IMAGE_ADDITIONAL_TAGS},${IMAGE_ADDITIONAL_TAGS}-keycloak
      - KEYCLOAK_POLICY_ENFORCER: "false"
        UMA_POLICY_ENFORCER: "true"
        QUARKUS_CONTAINER_IMAGE_TAG: ${IMAGE_TAG}-uma
        QUARKUS_CONTAINER_IMAGE_ADDITIONAL_TAGS: ${IMAGE_ADDITIONAL_TAGS}-uma
      - KEYCLOAK_POLICY_ENFORCER: "false"
        UMA_POLICY_ENFORCER: "false"
        QUARKUS_CONTAINER_IMAGE_TAG: ${IMAGE_TAG}-noauth
        QUARKUS_CONTAINER_IMAGE_ADDITIONAL_TAGS: ${IMAGE_ADDITIONAL_TAGS}-noauth
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests install -Pservices
      -Dquarkus.container-image.push=true
      -Dkvasir.plugins.policy-agent.keycloak.enabled=$KEYCLOAK_POLICY_ENFORCER
      -Dkvasir.plugins.policy-agent.uma.enabled=$UMA_POLICY_ENFORCER
  interruptible: true
  artifacts:
    paths:
      - "**/target/*.jar"

build:writerside:
  needs: [build:maven]
  stage: test
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  image: registry.jetbrains.team/p/writerside/builder/writerside-builder:$DOCKER_VERSION
  script:
    - set -e
    - export DISPLAY=:99
    - Xvfb :99 &
    - /opt/builder/bin/idea.sh helpbuilderinspect -source-dir . -product $INSTANCE --runner gitlab -output-dir public/ || true
    - echo "Testing existence of $ARTIFACT..."
    - test -e public/$ARTIFACT
  artifacts:
    paths:
      - public/$ARTIFACT
      - public/report.json
      - public/$ALGOLIA_ARTIFACT
    expire_in: 1 week
  interruptible: true

test:writerside:
  needs: [build:writerside]
  image: $JDK_IMAGE
  stage: test
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  script:
    - cd public
    - curl -o wrs-checker.jar -L https://packages.jetbrains.team/maven/p/writerside/maven/com/jetbrains/writerside/writerside-ci-checker/1.0/writerside-ci-checker-1.0.jar
    - java -jar wrs-checker.jar report.json $INSTANCE

pages:
  stage: deploy
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  needs: [build:writerside, test:writerside]
  image: ubuntu:latest
  before_script:
    - apt-get update -y && apt-get install unzip -y
  script:
    - cd public
    - unzip -O UTF-8 $ARTIFACT
    - ls -l
  artifacts:
    paths:
      - public
    expire_in: 1 week
  interruptible: false

search:
  stage: search
  rules:
    # Never run when the ALGOLIA_KEY is not set
    - when: never
      if: "$ALGOLIA_KEY == null"
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  needs: [build:writerside, test:writerside, pages]
  image: registry.jetbrains.team/p/writerside/builder/algolia-publisher:2.0.32-3
  script:
    - unzip -O UTF-8 public/$ALGOLIA_ARTIFACT -d algolia-indexes
    - env "algolia-key=$ALGOLIA_KEY" java -jar /opt/builder/help-publication-agent.jar update-index --application-name "$ALGOLIA_APP_NAME" --index-name "$ALGOLIA_INDEX_NAME" --product "$CONFIG_JSON_PRODUCT" --version "$CONFIG_JSON_VERSION" --index-directory algolia-indexes/ 2>&1 | tee algolia-update-index-log.txt
  artifacts:
    paths:
      - algolia-update-index-log.txt
    expire_in: 1 week
  interruptible: false

smoke_test:compose:
  tags: ["docker"]
  image: docker
  stage: verify
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  before_script:
    - apk add --no-cache bash jq curl
    - timeout=30
    - start_time=$(date +%s)
    - |
      while ! docker info >/dev/null 2>&1; do
        if [ $(( $(date +%s) - start_time )) -ge $timeout ]; then
          echo "Timeout waiting for Docker daemon to be ready." >&2
          exit 1
        fi
        sleep 1
      done
    - echo "$DOCKER_TOKEN" | docker login -u $DOCKER_USER --password-stdin
    - echo "$DOCKER_TOKEN" | docker login docker.redpanda.com -u $DOCKER_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - cd .deployment/docker-compose
    - sed -i "s%kvasir/kvasir-server/monolith:.*%$QUARKUS_CONTAINER_IMAGE_GROUP/monolith:$IMAGE_TAG%g" docker-compose.yml
    - docker compose up -d --wait --quiet-pull --no-color
    - docker ps
    - tests/compose-smoke-test.sh
  after_script:
    - cd .deployment/docker-compose
    - docker ps -a > compose-ps.txt
    - docker compose logs --no-color > compose-logs.txt
    - docker compose down
  artifacts:
    paths:
      - .deployment/docker-compose/compose-logs.txt
      - .deployment/docker-compose/docker-compose.yml
      - .deployment/docker-compose/compose-ps.txt
    expire_in: 1 week
    when: on_failure

deploy:cnl:
  stage: deploy
  image: ghcr.io/helmfile/helmfile:v0.171.0
  allow_failure: true
  rules:
    # only run on this repo not on forks
    - if: '$CI_PROJECT_NAME != "kvasir-next" && $CI_PROJECT_NAMESPACE != "ibcndevs/solid"'
      when: never
    - if: "$CI_COMMIT_TAG"
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: "$CI_COMMIT_BRANCH==$CI_DEFAULT_BRANCH"
      when: manual
  before_script:
    - kubectl config use-context ibcndevs/clusters:kvasir-cnl
    - kubectl config view --minify
    - echo $DOCKER_TOKEN | helm registry login docker.io -u $DOCKER_USER --password-stdin
  script:
    - cd kubernetes
    - helmfile deps
    - helmfile sync
