# .gitlab-ci.yml

include:
  - local: /.ci/templates.yml
  - local: /.ci/maven.yml
  - local: /.ci/compose.yml
  - local: /.ci/docs.yml
  - local: /.ci/release.yml
  - local: /.ci/timoni.yml
  - local: /.ci/kind.yml

variables:
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -ffdx
  INSTANCE: "Writerside/kd"
  ARTIFACT: "webHelpKD2-all.zip"
  ALGOLIA_ARTIFACT: "algolia-indexes-KD.zip"
  ALGOLIA_APP_NAME: "23BLLNEZ2S"
  ALGOLIA_INDEX_NAME: "prod_KVASIR-NEXT"
  CONFIG_JSON_PRODUCT: "kd"
  CONFIG_JSON_VERSION: "main"
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -Dstyle.color=always
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=target/
  CI_TOOLS_REGISTRY: "gitlab.ilabt.imec.be:4567/discover/ci-tools"
  WRITERSIDE_IMAGE: "${CI_TOOLS_REGISTRY}/writerside-builder:2025.04.8412"
  QUARKUS_JIB_BASE_JVM_IMAGE: "${CI_TOOLS_REGISTRY}/eclipse-temurin:25_36-jre-noble"
  JDK_IMAGE: "${CI_TOOLS_REGISTRY}/eclipse-temurin:25_36-jdk-noble"
  CI_TOOLS_IMAGE: "${CI_TOOLS_REGISTRY}:4.1.1"
  QUARKUS_JIB_PLATFORMS: "linux/amd64,linux/arm64/v8"
  QUARKUS_CONTAINER_IMAGE_PUSH: "false"
  QUARKUS_CONTAINER_IMAGE_REGISTRY: $CI_REGISTRY
  QUARKUS_CONTAINER_IMAGE_GROUP: $CI_PROJECT_PATH
  QUARKUS_CONTAINER_IMAGE_USERNAME: $CI_REGISTRY_USER
  QUARKUS_CONTAINER_IMAGE_PASSWORD: $CI_REGISTRY_PASSWORD

stages:
  - test
  - package
  - verify
  - deploy
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
        IMAGE_ADDITIONAL_TAG: "$CI_COMMIT_REF_SLUG"
        QUARKUS_CONTAINER_IMAGE_PUSH: "true"
    # Always run a pipeline on the default branch, even when an MR is open.
    # This is required for release-pr and release:publish to trigger after a release MR is merged.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Suppress redundant branch pipelines when an MR is open for that branch.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"
        IMAGE_ADDITIONAL_TAG: "latest"
        QUARKUS_CONTAINER_IMAGE_PUSH: "true"
    - if: $CI_COMMIT_BRANCH
