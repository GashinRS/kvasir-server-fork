<nz-page-header>
  <nz-page-header-title>Slices</nz-page-header-title>
  <nz-page-header-subtitle
    >Shape your own views over your data</nz-page-header-subtitle
  >
  <nz-page-header-extra>
    <button nz-button nzType="primary" [routerLink]="['./new']">
      Create Slice
    </button>
  </nz-page-header-extra>
</nz-page-header>

@if (slices.hasValue()) {
  <nz-table #basicTable [nzData]="slices.value()!" nzTableLayout="fixed">
    <thead>
      <tr>
        <th nzWidth="auto">name</th>
        <th class="actions" nzWidth="150px">action</th>
      </tr>
    </thead>
    <tbody>
      @for (data of basicTable.data; track data) {
        @let dataName = data["kss:name"];
        <tr>
          <td class="name">
            <nz-space>
              <span
                *nzSpaceItem
                nz-popover
                [nzPopoverTitle]="idTitleTpl"
                [nzPopoverContent]="data['@id']"
                nzPopoverPlacement="topLeft"
                class="id"
                (click)="copyText(data['@id'])"
                ><nz-icon nzType="idcard"></nz-icon
              ></span>
              <ng-template #idTitleTpl>
                <span>@id</span><span [class]="clickToCopyCss()"><small>(click to copy)</small></span>
              </ng-template>
              <span *nzSpaceItem>{{ dataName }}</span>
            </nz-space>
            <div nz-typography nzEllipsis class="desc">{{ data['kss:description'] ?? '-' }}</div>
          </td>
          <td class="actions-td" align="right">
            <nz-space>
              <nz-space-compact *nzSpaceItem nzSize="default">
                <button
                  nz-button
                  nzType="primary"
                  (click)="querySlice(dataName)"
                  nz-tooltip
                  nzTooltipTitle="Query"
                >
                  <nz-icon nzType="code" />
                </button>
                <button
                  nz-button
                  nzType="primary"
                  nzGhost
                  (click)="writeToSlice(dataName)"
                  nz-tooltip
                  nzTooltipTitle="Changes"
                >
                  <nz-icon nzType="history" />
                </button>
                <button
                  nz-button
                  nzType="primary"
                  nzGhost
                  (click)="editSlice(dataName)"
                  nz-tooltip
                  nzTooltipTitle="Edit"
                >
                  <nz-icon nzType="edit" />
                </button>
              </nz-space-compact>
              <button
                *nzSpaceItem
                nz-button
                nzType="primary"
                nzDanger
                (click)="deleteSlice(dataName)"
                nz-tooltip
                nzTooltipTitle="Delete"
              >
                <nz-icon nzType="delete" />
              </button>
            </nz-space>
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
}
