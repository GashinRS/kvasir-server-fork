@if (permissionForm) {
  <form
    nz-form
    [formGroup]="permissionForm"
    [nzLayout]="'vertical'"
    [nzAutoTips]="autoTips"
    name="permission"
    (ngSubmit)="check()"
  >
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Subject</nz-form-label>
          <nz-form-control>
            <nz-input-group
              [nzAddOnBefore]="addOnBeforeTemplate"
              [nzPrefix]="prefix()"
            >
              <input type="text" nz-input formControlName="subject" />
            </nz-input-group>
            <ng-template #addOnBeforeTemplate>
              <nz-select
                name="subjectAddon"
                [(ngModel)]="subjectAddon"
                [ngModelOptions]="{ standalone: true }"
              >
                <nz-option nzLabel="E-mail" nzValue="email"></nz-option>
                <nz-option nzLabel="WebID" nzValue="webid"></nz-option>
                <nz-option nzLabel="User" nzValue="user"></nz-option>
                <!-- <nz-option nzLabel="Anyone" nzValue="everyone"></nz-option> -->
              </nz-select>
            </ng-template>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Permission</nz-form-label>
          <nz-form-control>
            <nz-select
              name="permission"
              [nzOptions]="permissions"
              formControlName="permission"
            >
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Resource (path)</nz-form-label>
          <nz-form-control>
            <nz-input-group [nzPrefix]="pathPrefix">
              <input type="text" nz-input formControlName="object" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col nzSpan="24" class="resultRow">
        <div [class]="resultClass()" [class.result]="true">
          {{ resultLabel() }}
        </div>
        <button nz-button nzType="default" type="submit">Check</button>
      </nz-col>
    </nz-row>
  </form>

  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="reset()">Reset</button>
    <button nz-button nzType="primary" (click)="close()">Close</button>
  </div>
}
