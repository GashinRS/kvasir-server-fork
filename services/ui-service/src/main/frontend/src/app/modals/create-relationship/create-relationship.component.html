@if (relationshipForm) {
  <form
    nz-form
    [formGroup]="relationshipForm"
    [nzLayout]="'vertical'"
    name="relationship"
    [nzAutoTips]="autoTips"
  >
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Subject</nz-form-label>
          <nz-form-control>
            <nz-input-group
              [nzAddOnBefore]="addOnBeforeTemplate"
              [nzPrefix]="prefix()"
            >
              <input type="text" nz-input formControlName="subject" />
            </nz-input-group>
            <ng-template #addOnBeforeTemplate>
              <nz-select
                name="subjectAddon"
                [(ngModel)]="subjectAddon"
                [ngModelOptions]="{ standalone: true }"
              >
                <nz-option nzLabel="E-mail" nzValue="email"></nz-option>
                <nz-option nzLabel="WebID" nzValue="webid"></nz-option>
                <nz-option nzLabel="User" nzValue="user"></nz-option>
                <!-- <nz-option nzLabel="Anyone" nzValue="everyone"></nz-option> -->
              </nz-select>
            </ng-template>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Relation</nz-form-label>
          <nz-form-control>
            <nz-select
              name="relation"
              [nzOptions]="relations"
              formControlName="relation"
            >
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Resource (path)</nz-form-label>
          <nz-form-control>
            <nz-input-group [nzPrefix]="pathPrefix">
              <input type="text" nz-input formControlName="object" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
  </form>

  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="reset()">Reset</button>
    <button
      nz-button
      nzType="primary"
      type="submit"
      [disabled]="relationshipForm.invalid"
      (click)="create()"
    >
      Create
    </button>
  </div>
}
