<nz-page-header>
  <nz-page-header-title>Edit Slice</nz-page-header-title>
  <nz-page-header-subtitle>Edit an existing Slice</nz-page-header-subtitle>
</nz-page-header>

<form
  nz-form
  [nzLayout]="'vertical'"
  [formGroup]="editForm"
  (ngSubmit)="saveForm()"
>
  <nz-row>
    <nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label>name</nz-form-label>
        <nz-form-control>
          <input type="text" nz-input formControlName="kss:name" />
        </nz-form-control>
      </nz-form-item>
    </nz-col>
  </nz-row>
  <nz-row [nzGutter]="[20, 20]">
    <nz-col [nzXs]="24" [nzLg]="12">
      <nz-form-item>
        <nz-form-label>&#64;context</nz-form-label>
        <nz-form-control [nzAutoTips]="autoTips">
          <nz-code-editor
            class="field"
            formControlName="@context"
            [nzEditorOption]="settings.getCodeEditorSetting().json"
          ></nz-code-editor>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
    <nz-col [nzXs]="24" [nzLg]="12">
      <nz-form-item>
        <nz-form-label>description</nz-form-label>
        <nz-form-control>
          <textarea
            nz-input
            formControlName="kss:description"
            rows="6"
          ></textarea>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
  </nz-row>
  <nz-row>
    <nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label>schema</nz-form-label>
        <nz-form-control>
          <nz-code-editor
            class="editor"
            formControlName="kss:schema"
            [nzEditorOption]="settings.getCodeEditorSetting().graphql"
          ></nz-code-editor>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
  </nz-row>
  <nz-row>
    <nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control>
          <div nz-flex nzJustify="flex-end">
            <nz-space>
              <button
                type="button"
                *nzSpaceItem
                nz-button
                nzType="link"
                (click)="reset()"
              >
                Reset
              </button>
              <button
                *nzSpaceItem
                nz-button
                type="submit"
                nzType="primary"
                [disabled]="editForm.invalid"
              >
                Save
              </button>
            </nz-space>
          </div>
        </nz-form-control>
      </nz-form-item>
    </nz-col>
  </nz-row>
</form>
