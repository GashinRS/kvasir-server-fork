quarkus:
  http:
    cors:
      enabled: true
      origins: /.*/
      access-control-allow-credentials: true
      exposed-headers:
        - Accept-Patch
        - Accept-Post
        - Accept-Put
        - Allow
        - ETag
        - Last-Modified
        - Link
        - Location
        - WAC-Allow
        - Www-Authenticate
  smallrye-openapi:
    store-schema-directory: target/openapi
  # Kafka Streams must use a distinct application-id so it never shares a
  # consumer group with the SmallRye Reactive Messaging consumers (which
  # default their group.id to the Quarkus application name, i.e. "monolith").
  # Mixing classic and stream consumer protocols in the same group causes
  # InconsistentGroupProtocolException and kills the Streams topology.
  # In dev/test a random UUID avoids state sharing across parallel runs.
  kafka-streams:
    application-id: change-processor
    topics: changes.incoming,changes.processing-completed

"%dev":
  quarkus:
    http:
      host: 0.0.0.0
      access-log:
        enabled: false
    kafka-streams:
      application-id: ${quarkus.uuid}
  kvasir:
    bootstrap:
      pods:
        - name: alice
          configuration:
            default-context:
              ex: http://example.org/
              so: http://schema.org/
            auto-ingest-rdf: true