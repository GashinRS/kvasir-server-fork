kvasir:
  services:
    storage:
      s3:
        host: localhost
        port: ${quarkus.minio.port}
        access-key: ${quarkus.minio.access-key}
        secret-key: ${quarkus.minio.secret-key}
quarkus:
  http:
    cors:
      ~: true
  minio:
    devservices:
  smallrye-openapi:
    store-schema-directory: ./openapi

"%dev":
  quarkus:
    http:
      cors:
        origins: /.*/
  kvasir:
    bootstrap:
      pods:
        - name: alice
          default-prefixes:
            rdfs: http://www.w3.org/2000/01/rdf-schema#
            xsd: http://www.w3.org/2001/XMLSchema#
            schema: http://schema.org/
            ex: http://example.org/
        - name: bob
          default-prefixes:
            rdfs: http://www.w3.org/2000/01/rdf-schema#
            xsd: http://www.w3.org/2001/XMLSchema#
            schema: http://schema.org/
            ex: http://example.org/