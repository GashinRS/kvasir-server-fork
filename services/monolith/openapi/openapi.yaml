---
openapi: 3.0.3
info:
  title: Kvasir API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
tags:
- name: Changes API
  description: "API for managing changes to the knowledge graph, including requesting\
    \ changes, listing changes, and retrieving change reports."
- name: Querying API
  description: API for querying the knowledge graph of a specific pod using GraphQL.
- name: Streaming API
  description: "API for streaming changes to the knowledge graph, including subscribing\
    \ to changes and retrieving change records."
- name: Low-level Storage API
  description: "API for interfacing with low-level storage (large RDF files, unstructured\
    \ or binary data) for a specific pod via S3 operations, modified to be compatible\
    \ with Solid auth(n/z). For more information, see the [S3 API documentation](https://docs.aws.amazon.com/AmazonS3/latest/API/API_Operations.html)."
- name: Pod Config API
  description: "API for managing pods, including creating, listing, deleting pods,\
    \ managing slices, etc."
paths:
  /:
    get:
      tags:
      - Pod Config API
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pod"
    post:
      tags:
      - Pod Config API
      requestBody:
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/RegisterPodInput"
      responses:
        "200":
          description: OK
          content:
            application/json: {}
  /{podId}:
    get:
      tags:
      - Pod Config API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/Pod"
    put:
      tags:
      - Pod Config API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/UpdatePodInput"
      responses:
        "200":
          description: OK
          content:
            application/json: {}
    delete:
      tags:
      - Pod Config API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json: {}
  /{podId}/changes:
    get:
      tags:
      - Changes API
      - Streaming API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeReport"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeRecords"
    post:
      tags:
      - Changes API
      summary: Perform mutations on the KG.
      description: "Post a change request, containing the requested mutations, to\
        \ the inbox of the specified pod."
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/ChangeRequestInput"
      responses:
        "201":
          description: Change request created.
  /{podId}/changes/{changeId}:
    get:
      tags:
      - Changes API
      parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/ChangeReport"
  /{podId}/changes/{changeId}/records:
    get:
      tags:
      - Changes API
      parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/ChangeRecords"
  /{podId}/query:
    post:
      tags:
      - Querying API
      summary: Retrieve data from the KG.
      description: Query the knowledge graph of the specified pod using GraphQL.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInputWithContext"
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              example:
                '@context':
                  ex: http://example.org/
                '@graph':
                - '@id': ex:123
                  ex:givenName: Bob
                  ex:friends:
                  - '@id': ex:456
                    ex:givenName: Alice
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
  /{podId}/slices:
    get:
      tags:
      - Pod Config API
      summary: List slices of the specified pod.
      description: List slices of the specified pod's Knowledge Graph.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SliceSummary"
    post:
      tags:
      - Pod Config API
      summary: Define a new slice of the KG.
      description: "Define a new slice (subset) of the specified pod's Knowledge Graph,\
        \ based on a GraphQL-LD schema."
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/SliceInput"
      responses:
        "200":
          description: OK
          content:
            application/json: {}
  /{podId}/slices/{sliceId}:
    get:
      tags:
      - Pod Config API
      summary: Retrieve a specific slice definition..
      description: Retrieve a specific slice definition details.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              schema:
                $ref: "#/components/schemas/Slice"
    delete:
      tags:
      - Pod Config API
      summary: Delete a specific slice.
      description: Delete a specific slice of the specified pod's Knowledge Graph.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json: {}
  /{podId}/slices/{sliceId}/changes:
    post:
      tags:
      - Changes API
      summary: Perform mutations on a specific slice of the KG.
      description: "Post a change request, containing the requested mutations, to\
        \ a slice inbox of the specified pod."
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: sliceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/ld+json:
            schema:
              $ref: "#/components/schemas/ChangeRequestInput"
      responses:
        "201":
          description: Change request created.
  /{podId}/slices/{sliceId}/query:
    post:
      tags:
      - Querying API
      summary: Retrieve data from a specific subset of the KG.
      description: Query a predefined slice of the specified pod's Knowledge Graph
        using GraphQL.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: sliceId
        in: path
        description: "Identifier of the Knowledge Graph slice, representing a subset\
          \ of the specified pod's Knowledge Graph."
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryInputImpl"
      responses:
        "200":
          description: OK
          content:
            application/ld+json:
              example:
                '@context':
                  ex: http://example.org/
                '@graph':
                - '@id': ex:123
                  ex:givenName: Bob
                  ex:friends:
                  - '@id': ex:456
                    ex:givenName: Alice
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
  /{podId}/slices/{sliceId}/shacl:
    get:
      tags:
      - Pod Config API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: sliceId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/turtle:
              schema:
                type: string
  /{podId}/slices/{sliceId}/stream:
    get:
      tags:
      - Streaming API
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: sliceId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
  /{podId}/s3/{objectKey}:
    get:
      tags:
      - Low-level Storage API
      summary: Download a stored object.
      description: Get an object from the specified pod's S3 storage.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The object content
    put:
      tags:
      - Low-level Storage API
      summary: Upload an object.
      description: Put an object to the specified pod's S3 storage.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
      - name: x-amz-content-sha256
        in: header
        description: The SHA256 hash of the object content (allows the server to verify
          the integrity of the content).
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: The MIME type of the object content.
        required: true
        schema:
          type: string
      - name: x-amz-date
        in: header
        description: "The date and time of the request, in ISO8601 format (offers\
          \ additional protection against replay attacks)."
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          description: The object was stored successfully
    delete:
      tags:
      - Low-level Storage API
      summary: Remove a stored object.
      description: Delete an object from the specified pod's S3 storage.
      parameters:
      - name: podId
        in: path
        required: true
        schema:
          type: string
      - name: objectKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The object was deleted successfully
components:
  schemas:
    Assertion:
      required:
      - '@type'
      - kss:query
      type: object
      properties:
        '@type':
          description: The type of the assertion.
          enum:
          - https://kvasir.discover.ilabt.imec.be/vocab#AssertEmptyResult
          - https://kvasir.discover.ilabt.imec.be/vocab#AssertNonEmptyResult
          type: string
          example: kss:AssertEmptyResult
        kss:query:
          description: The GraphQL query string to be executed.
          type: string
          example: "{ id ex_givenName(_: \"Bob\") }"
    ChangeRecords:
      required:
      - context
      - id
      - timestamp
      type: object
      properties:
        context:
          type: object
          additionalProperties: {}
        id:
          type: string
        timestamp:
          $ref: "#/components/schemas/Instant"
        deleted: {}
        inserted: {}
    ChangeReport:
      required:
      - id
      - podId
      - timestamp
      - resultCode
      type: object
      properties:
        id:
          type: string
        podId:
          type: string
        timestamp:
          $ref: "#/components/schemas/Instant"
        resultCode:
          $ref: "#/components/schemas/ChangeResultCode"
        sliceId:
          type: string
          nullable: true
        nrOfInserts:
          format: int64
          type: integer
        nrOfDeletes:
          format: int64
          type: integer
        errorMessage:
          type: string
          nullable: true
    ChangeRequestInput:
      required:
      - '@context'
      - kss:assert
      - kss:insert
      type: object
      properties:
        '@context':
          description: The JSON-LD context for the change request.
          type: object
          additionalProperties: {}
          example:
            kss: https://kvasir.discover.ilabt.imec.be/vocab#
            ex: http://example.org/
        kss:assert:
          description: List of assertions to be checked before applying the change
            request.
          type: array
          items:
            $ref: "#/components/schemas/Assertion"
        kss:with:
          description: Optional GraphQL query where matches are required to be found
            for the change request to be applied. Results are bound to the field names
            in the query and can be used in the insert and delete operations (via
            templates).
          type: string
          example: "{ id ex_givenName(_: \"Bob\") }"
          nullable: true
        kss:insert:
          description: "List of triples to be inserted, or a [JSONata](https://jsonata.org)\
            \ template string to be applied to the results of the with-clause."
          type: array
          items: {}
          example:
          - '@id': ex:123
            ex:givenName: Bob
    ChangeResultCode:
      enum:
      - COMMITTED
      - ASSERTION_FAILED
      - NO_MATCHES
      - TOO_MANY_MATCHES
      - VALIDATION_ERROR
      - INTERNAL_ERROR
      type: string
    Instant:
      format: date-time
      type: string
      example: 2022-03-10T16:15:50Z
    Pod:
      required:
      - id
      - configuration
      type: object
      properties:
        id:
          type: string
        configuration:
          type: object
          additionalProperties: {}
    QueryInputImpl:
      required:
      - query
      - targetGraphs
      type: object
      properties:
        query:
          description: The GraphQL query string to be executed.
          type: string
          example: "{ id ex_givenName(_: \"Bob\") ex_friends { id ex_givenName } }"
        operationName:
          description: "The name of the operation to be executed (optional, only required\
            \ if the GraphQL query expresses more than one operation)."
          type: string
          nullable: true
        variables:
          description: The variables to be used in the query.
          type: object
          additionalProperties: {}
          nullable: true
        targetGraphs:
          description: "The named graphs to be targeted by the query. If no graphs\
            \ are specified, all graphs are targeted."
          uniqueItems: true
          type: array
          items:
            type: string
        atTimestamp:
          description: Query the state of the KG at the specified point in time.
          type: string
          allOf:
          - $ref: "#/components/schemas/Instant"
          nullable: true
        atChangeRequest:
          description: Query the state of the KG when the specified change request
            was applied.
          type: string
          nullable: true
    QueryInputWithContext:
      required:
      - query
      - targetGraphs
      type: object
      properties:
        query:
          description: The GraphQL query string to be executed.
          type: string
          example: "{ id ex_givenName(_: \"Bob\") ex_friends { id ex_givenName } }"
        operationName:
          description: "The name of the operation to be executed (optional, only required\
            \ if the GraphQL query expresses more than one operation)."
          type: string
          nullable: true
        variables:
          description: The variables to be used in the query.
          type: object
          additionalProperties: {}
          nullable: true
        targetGraphs:
          description: "The named graphs to be targeted by the query. If no graphs\
            \ are specified, all graphs are targeted."
          uniqueItems: true
          type: array
          items:
            type: string
        atTimestamp:
          description: Query the state of the KG at the specified point in time.
          type: string
          allOf:
          - $ref: "#/components/schemas/Instant"
          nullable: true
        atChangeRequest:
          description: Query the state of the KG when the specified change request
            was applied.
          type: string
          nullable: true
        '@context':
          description: The JSON-LD context for the query.
          type: object
          additionalProperties: {}
          example:
            ex: http://example.org/
          nullable: true
    QueryResult:
      type: object
      properties:
        data:
          type: object
          additionalProperties: {}
          nullable: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: {}
          nullable: true
    RegisterPodInput:
      required:
      - name
      - configuration
      type: object
      properties:
        name:
          type: string
        configuration:
          type: object
          additionalProperties: {}
    Slice:
      required:
      - id
      - context
      - podId
      - name
      - description
      - schema
      - shacl
      - targetGraphs
      type: object
      properties:
        id:
          type: string
        context:
          type: object
          additionalProperties: {}
        podId:
          type: string
        name:
          type: string
        description:
          type: string
        schema:
          type: string
        shacl:
          type: string
        targetGraphs:
          uniqueItems: true
          type: array
          items:
            type: string
    SliceInput:
      required:
      - context
      - name
      - schema
      - description
      - targetGraphs
      type: object
      properties:
        context:
          type: object
          additionalProperties: {}
        name:
          type: string
        schema:
          type: string
        description:
          type: string
        targetGraphs:
          uniqueItems: true
          type: array
          items:
            type: string
    SliceSummary:
      required:
      - id
      - name
      - description
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    UpdatePodInput:
      required:
      - configuration
      type: object
      properties:
        configuration:
          type: object
          additionalProperties: {}
