quarkus.kafka-streams.topics=changes.incoming,changes.processing-completed
%test.quarkus.kafka-streams.topics=${quarkus.uuid}.test.changes.incoming,${quarkus.uuid}.test.changes.processing-completed
# Use a stable, distinct application-id so Kafka Streams never shares a
# consumer group with the SmallRye Reactive Messaging consumers (which also
# default group.id to the application name). In dev/test a random UUID is used
# so parallel test runs don't share state.
quarkus.kafka-streams.application-id=change-processor
%test.quarkus.kafka-streams.application-id=${quarkus.uuid}
%test.kvasir-ext.change-processor.shutdown-on-error=false
%test.kvasir-ext.change-processor.ignore-non-existing-pod=true
%dev.kvasir-ext.change-processor.shutdown-on-error=false
%dev.kvasir-ext.change-processor.ignore-non-existing-pod=true