image: node:20

variables:
  PUBLIC_CONTAINER_REPO: "gitlab.ilabt.imec.be:4567/kvasir/kvasir-server"

stages:
  - build
  - package

npm-build:
  stage: build
  script:
    - npm ci
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - node_modules/
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: "1 day"
    paths:
      - dist/

dockerize-latest:
  stage: package
  tags:
    - docker
    - cache
  image: 
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:latest
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create tls-context
    - docker --context tls-context buildx create --name multiarch --driver docker-container --bootstrap
    - docker buildx use multiarch
    - docker buildx ls
  script:
    - echo "$KVASIR_SERVER_PASSWORD" | docker login $CI_REGISTRY -u $KVASIR_SERVER_USERNAME --password-stdin
    - docker buildx build -t $PUBLIC_CONTAINER_REPO/kvasir-ui:latest -f docker/Dockerfile --platform linux/amd64,linux/arm64 -o type=registry --provenance false .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

dockerize-tag-latest:
  stage: package
  tags:
    - docker
    - cache
  image: 
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:latest
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:dind"
      alias: docker
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create tls-context
    - docker --context tls-context buildx create --name multiarch --driver docker-container --bootstrap
    - docker buildx use multiarch
    - docker buildx ls
  script:
    - echo "$KVASIR_SERVER_PASSWORD" | docker login $CI_REGISTRY -u $KVASIR_SERVER_USERNAME --password-stdin
    - docker buildx build -t $PUBLIC_CONTAINER_REPO/kvasir-ui:${CI_COMMIT_TAG} -t $PUBLIC_CONTAINER_REPO/kvasir-ui:latest -f docker/Dockerfile --platform linux/amd64,linux/arm64 -o type=registry --provenance false .
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
