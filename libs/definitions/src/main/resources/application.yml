kvasir:
  http:
    base-uri: http://localhost:8080/
    webclient-uri: ${kvasir.http.base-uri}_ui/

"%dev":
  quarkus:
    log:
      level: INFO
      category:
        "kvasir":
          level: DEBUG
          min-level: DEBUG
        "idlab":
          level: DEBUG
          min-level: DEBUG
        # Reduce log level for Kafka Streams to WARN to avoid excessive logging during development
        "org.apache.kafka.streams":
          level: WARN
          min-level: WARN

"%test":
  quarkus:
    log:
      level: INFO
      category:
        "kvasir":
          level: DEBUG
          min-level: DEBUG
