mp:
  messaging:
    outgoing:
      change_requests_publish:
        connector: smallrye-kafka
        topic: change_requests
        merge: true
        waitForWriteCompletion: false
      storage_mutations_publish:
        connector: smallrye-kafka
        topic: storage_mutations
        merge: true
        waitForWriteCompletion: false
    incoming:
      change_requests_subscribe:
        connector: smallrye-kafka
        topic: change_requests
        broadcast: true
        auto:
          offset:
            reset: earliest
      storage_mutations_subscribe:
        connector: smallrye-kafka
        topic: storage_mutations
        broadcast: true
        auto:
          offset:
            reset: earliest

"%dev":
   quarkus:
     log:
       level: INFO
       category:
         "kvasir":
           level: DEBUG
           min-level: DEBUG
