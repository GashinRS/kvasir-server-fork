"%test":
  quarkus:
    management:
      test-port: 9002
    kvasir:
      base-uri: http://localhost:${quarkus.http.test-port}/
      plugins:
        policy-agent:
          keycloak:
            enabled: false
          solid-uma:
            enabled: false
      services:
        storage:
          s3:
            host: localhost
            port: ${quarkus.minio.port}
            access-key: ${quarkus.minio.access-key}
            secret-key: ${quarkus.minio.secret-key}
      bootstrap:
        pods:
          - name: test1
            default-context: |
              {
                "kss": "https://kvasir.discover.ilabt.imec.be/vocab#",
                "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
                "xsd": "http://www.w3.org/2001/XMLSchema#",
                "schema": "http://schema.org/",
                "ex": "http://example.org/",
                "saref": "https://saref.etsi.org/core/",
                "hasMeasurement": {
                  "@reverse": "https://saref.etsi.org/core/measurementMadeBy"
                },
                "children": { "@reverse": "http://example.org/parent" }
              }
            auto-ingest-rdf: true
          - name: test2
            default-context: |
              {
                "kss": "https://kvasir.discover.ilabt.imec.be/vocab#",
                "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
                "xsd": "http://www.w3.org/2001/XMLSchema#",
                "schema": "http://schema.org/",
                "ex": "http://example.org/",
                "saref": "https://saref.etsi.org/core/",
                "hasMeasurement": {
                  "@reverse": "https://saref.etsi.org/core/measurementMadeBy"
                },
                "children": { "@reverse": "http://example.org/parent" }
              }
            auto-ingest-rdf: true
          - name: test3
            default-context: |
              {
                "kss": "https://kvasir.discover.ilabt.imec.be/vocab#",
                "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
                "xsd": "http://www.w3.org/2001/XMLSchema#",
                "schema": "http://schema.org/",
                "ex": "http://example.org/",
                "saref": "https://saref.etsi.org/core/",
                "hasMeasurement": {
                  "@reverse": "https://saref.etsi.org/core/measurementMadeBy"
                },
                "children": { "@reverse": "http://example.org/parent" }
              }
            auto-ingest-rdf: true